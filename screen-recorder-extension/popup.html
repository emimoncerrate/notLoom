<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Screen Recorder</title>
  <style>
    body {
      width: 300px;
      padding: 20px;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8fafc;
    }
    
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    
    .header h1 {
      margin: 0 0 5px 0;
      font-size: 18px;
      color: #1e293b;
    }
    
    .header p {
      margin: 0;
      font-size: 12px;
      color: #64748b;
    }
    
    .recording-options {
      margin-bottom: 20px;
    }
    
    .option {
      margin-bottom: 12px;
    }
    
    .option label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 14px;
      color: #334155;
    }
    
    .option input[type="checkbox"] {
      width: 16px;
      height: 16px;
    }
    
    .start-btn {
      width: 100%;
      padding: 12px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    
    .start-btn:hover {
      background: #2563eb;
    }
    
    .start-btn:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }
    
    .status {
      margin-top: 15px;
      padding: 10px;
      border-radius: 6px;
      font-size: 12px;
      text-align: center;
      display: none;
    }
    
    .status.success {
      background: #dcfce7;
      color: #166534;
      border: 1px solid #bbf7d0;
    }
    
    .status.error {
      background: #fef2f2;
      color: #dc2626;
      border: 1px solid #fecaca;
    }
    
    .footer {
      margin-top: 15px;
      text-align: center;
      font-size: 10px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🎬 Screen Recorder</h1>
    <p>Record screen with floating controls</p>
  </div>

  <div class="recording-options">
    <div class="option">
      <label>
        <input type="checkbox" id="includeMicrophone" checked>
        Include microphone audio
      </label>
    </div>
    <div class="option">
      <label>
        <input type="checkbox" id="includeSystemAudio">
        Include system audio (if supported)
      </label>
    </div>
  </div>

  <button id="startRecording" class="start-btn">
    🎬 Start Recording
  </button>

  <div id="status" class="status"></div>

  <div class="footer">
    Floating controls will appear on the page
  </div>

  <script src="popup.js"></script>
</body>
</html>
